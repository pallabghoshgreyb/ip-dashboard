services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ip-dashboard-app

    environment:
      DATABASE_URL: ${DATABASE_URL}
      PGSSL: ${PGSSL:-false}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: ${PORT:-3000}
      NODE_ENV: production

    ports:
      - "3001:3000"

    volumes:
      - ./logs:/app/logs

    restart: unless-stopped
