version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ip-dashboard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ip_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ip-dashboard-network
    restart: always

  app:
    image: ghcr.io/${GITHUB_REPOSITORY}:main
    container_name: ip-dashboard-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PGSSL: "false"
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - ip-dashboard-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:

networks:
  ip-dashboard-network:
    driver: bridge
