name: Build & Deploy to Server

on:
  push:
    branches: [main]

concurrency:
  group: ip-dashboard-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ip-dashboard-app:${{ github.sha }} .

      - name: Stop and remove old container
        run: |
          docker stop ip-dashboard-app 2>/dev/null || true
          docker rm ip-dashboard-app 2>/dev/null || true

      - name: Start new container
        run: |
          docker run -d \
            --name ip-dashboard-app \
            -p 3001:3000 \
            --env-file /opt/ip-dashboard/.env \
            --restart unless-stopped \
            ip-dashboard-app:${{ github.sha }}

      - name: Verify
        run: |
          sleep 5
          docker ps --filter "name=ip-dashboard-app"
          curl --fail http://localhost:3001/api/health
